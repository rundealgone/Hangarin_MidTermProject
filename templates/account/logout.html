{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangarin · Sign Out</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 16px rgba(30,58,138,0.08);
      text-align: center;
    }
    .brand { font-size: 22px; font-weight: 700; color: #1d4ed8; margin-bottom: 20px; }
    h2 { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .btn-primary {
      width: 100%; background: #1d4ed8; color: #fff;
      border: none; border-radius: 6px; padding: 10px;
      font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: background 0.15s; margin-bottom: 10px;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-cancel {
      width: 100%; background: #fff; color: #374151;
      border: 1px solid #d1d5db; border-radius: 6px; padding: 10px;
      font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif;
      cursor: pointer; text-decoration: none; display: block;
    }
    .btn-cancel:hover { background: #f9fafb; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Hangarin</div>
  <h2>Sign Out</h2>
  <p>Are you sure you want to sign out?</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-primary">Yes, Sign Out</button>
  </form>
  <a href="/" class="btn-cancel">Cancel</a>
</div>
</body>
</html>
