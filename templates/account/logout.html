{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hangarin · Sign Out</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
    }
    .brand { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #1e3a8a, #2563eb); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 20px; }
    h2 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 10px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    .btn-primary { width: 100%; background: #1d4ed8; color: #fff; border: none; border-radius: 40px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary:hover { background: #1e40af; }
    .btn-cancel { width: 100%; background: #fff; color: #374151; border: 1.5px solid #e2e8f0; border-radius: 40px; padding: 12px; font-size: 14px; font-weight: 500; text-decoration: none; display: block; }
    .btn-cancel:hover { background: #f9fafb; }
    @media (max-width: 480px) { .card { padding: 28px 20px; } .brand { font-size: 24px; } }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Hangarin</div>
  <h2>Sign Out</h2>
  <p>Are you sure you want to sign out?</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-primary">Yes, Sign Out</button>
  </form>
  <a href="/" class="btn-cancel">Cancel</a>
</div>
</body>
</html>
