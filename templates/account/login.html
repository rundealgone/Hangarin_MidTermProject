{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hangarin · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 28px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
    }
    .brand { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #1e3a8a, #2563eb); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 6px; }
    .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 28px; }
    .tabs { display: flex; gap: 8px; background: #f1f5f9; padding: 4px; border-radius: 60px; margin-bottom: 28px; }
    .tab { flex: 1; text-align: center; padding: 10px 0; font-weight: 600; font-size: 14px; border-radius: 40px; background: transparent; color: #5b6e8c; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
    .tab.active { background: white; color: #1e40af; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .panel { display: none; animation: fadeIn 0.25s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
    .form-group input { width: 100%; padding: 12px 14px; font-size: 14px; font-family: 'Inter', sans-serif; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 20px; transition: all 0.2s; }
    .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .btn-primary { width: 100%; background: #1d4ed8; color: white; border: none; border-radius: 40px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; transition: all 0.2s; }
    .btn-primary:hover { background: #1e40af; transform: scale(0.98); }
    .divider { display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 12px; margin: 20px 0 16px; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: white; border: 1.5px solid #e2e8f0; border-radius: 40px; padding: 10px; font-weight: 600; font-size: 13px; color: #1e293b; text-decoration: none; transition: all 0.2s; }
    .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }
    .error { background: #fef2f2; border-left: 4px solid #ef4444; padding: 10px 14px; border-radius: 16px; font-size: 12px; color: #b91c1c; margin-bottom: 16px; }
    @media (max-width: 480px) { .card { padding: 24px 20px; } .brand { font-size: 24px; } .tab { font-size: 13px; padding: 8px 0; } .form-group input { padding: 10px 12px; } }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Hangarin</div>
  <div class="subtitle">organize · focus · achieve</div>
  <div class="tabs">
    <button class="tab active" data-tab="login">Sign In</button>
    <button class="tab" data-tab="register">Create account</button>
  </div>
  <div class="panel active" id="panel-login">
    {% if form.non_field_errors %}
    <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}
    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="login" placeholder="Enter username or email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <div class="divider">or</div>
    <a href="{% provider_login_url 'google' %}" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
  </div>
  <div class="panel" id="panel-register">
    <form method="post" action="{% url 'account_signup' %}">
      {% csrf_token %}
      <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Choose a username" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Your email address" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password1" placeholder="Create a password" required></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" name="password2" placeholder="Repeat password" required></div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <div class="divider">or</div>
    <a href="{% provider_login_url 'google' %}" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign up with Google
    </a>
  </div>
</div>
<script>
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      const tabName = this.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('panel-' + tabName).classList.add('active');
    });
  });
</script>
</body>
</html>
