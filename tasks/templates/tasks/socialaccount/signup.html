{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hangarin · Complete Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 28px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); }
    .brand { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #1e3a8a, #2563eb); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 6px; }
    .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
    .info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 12px 14px; font-size: 13px; color: #1d4ed8; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; font-size: 14px; border: 1.5px solid #e2e8f0; border-radius: 20px; font-family: 'Inter', sans-serif; }
    .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .btn-primary { width: 100%; background: #1d4ed8; color: #fff; border: none; border-radius: 40px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #1e40af; }
    .error { background: #fef2f2; border-left: 4px solid #ef4444; padding: 10px 14px; border-radius: 16px; font-size: 12px; color: #b91c1c; margin-bottom: 16px; }
    @media (max-width: 480px) { .card { padding: 24px 20px; } .brand { font-size: 24px; } }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Hangarin</div>
  <div class="subtitle">Almost there! Complete your account</div>
  <div class="info-box">You are signing in with your Google account. Please choose a username to continue.</div>
  {% if form.errors %}
  <div class="error">{{ form.errors }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Username</label>
      {{ form.username }}
    </div>
    <div class="form-group">
      <label>Email</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn-primary">Complete Sign Up</button>
  </form>
</div>
</body>
</html>
