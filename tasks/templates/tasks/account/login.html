{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangarin · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 16px rgba(30,58,138,0.08);
    }
    .brand { font-size: 22px; font-weight: 700; color: #1d4ed8; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 13.5px; margin-bottom: 28px; }
    .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid #e5e7eb; }
    .tab {
      flex: 1; text-align: center; padding: 8px;
      font-size: 14px; font-weight: 500; color: #6b7280;
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all 0.15s; text-decoration: none;
    }
    .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .form-group input {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 9px 12px; font-size: 14px; font-family: 'Inter', sans-serif;
      color: #111827; transition: border-color 0.15s;
    }
    .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .btn-primary {
      width: 100%; background: #1d4ed8; color: #fff;
      border: none; border-radius: 6px; padding: 10px;
      font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; margin-top: 6px; transition: background 0.15s;
    }
    .btn-primary:hover { background: #1e40af; }
    .divider { text-align: center; color: #9ca3af; font-size: 13px; margin: 16px 0; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e5e7eb;
    }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .btn-google {
      width: 100%; background: #fff; border: 1px solid #d1d5db;
      border-radius: 6px; padding: 10px; font-size: 14px; font-weight: 500;
      font-family: 'Inter', sans-serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-decoration: none; color: #111827; transition: background 0.15s;
    }
    .btn-google:hover { background: #f9fafb; border-color: #9ca3af; }
    .error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Hangarin</div>
  <div class="subtitle">Sign in to manage your tasks</div>

  <div class="tabs">
    <a class="tab active" href="#" onclick="return switchTab('login', this)">Login</a>
    <a class="tab" href="#" onclick="return switchTab('register', this)">Register</a>
  </div>

  <!-- Login Panel -->
  <div class="panel active" id="panel-login">
    {% if form.non_field_errors %}
    <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}
    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="login" placeholder="Enter username or email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <div class="divider">or</div>
    <a href="{% provider_login_url 'google' process='login' %}&prompt=select_account" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
  </div>

  <!-- Register Panel -->
  <div class="panel" id="panel-register">
    <form method="post" action="{% url 'account_signup' %}">
      {% csrf_token %}
      <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Choose a username" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Your email address" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password1" placeholder="Create a password" required></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" name="password2" placeholder="Repeat password" required></div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <div class="divider">or</div>
    <a href="{% provider_login_url 'google' process='login' %}&prompt=select_account" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign up with Google
    </a>
  </div>
</div>
<script>
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  return false;
}
</script>
</body>
</html>
