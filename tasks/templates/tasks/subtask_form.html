{% extends "tasks/base.html" %}
{% block title %}Edit Subtask{% endblock %}

{% block nav_actions %}
  <a href="{% url 'task_detail' subtask.parent_task.pk %}" class="btn btn-white">← Back</a>
{% endblock %}

{% block content %}
<div class="page-header"><h1>Edit Subtask</h1></div>
<div class="form-card">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label>{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn btn-blue">Save Changes</button>
      <a href="{% url 'task_detail' subtask.parent_task.pk %}" class="btn btn-white">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
